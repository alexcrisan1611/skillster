name: release

# Push a tag like v0.1.0 to build Windows (x64 and ARM64) and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-latest
    env:
      NAME: skillster-${{ matrix.target }}
      BIN: target/${{ matrix.target }}/release
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory $env:NAME | Out-Null
          Copy-Item "$env:BIN/skillster.exe", "$env:BIN/skillsterd.exe", "$env:BIN/skillster-ui.exe", README.md $env:NAME
          Compress-Archive $env:NAME "$env:NAME.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: skillster-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: |
          cp install.ps1 dist/
          cd dist && sha256sum * > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
